<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Tokyo 3D City</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loader">
  <h1>TOKYO 3D</h1>
  <p>Đang dựng thành phố…</p>
  <div id="load-bar"><div id="load-bar-fill"></div></div>
  <div id="load-row"><span id="load-label">Chuẩn bị</span><span id="load-pct">0%</span></div>
</div>

<div id="topbar">TOKYO 3D <span style="opacity:.6;font-size:.75em">v1</span><small>Thành phố Tokyo</small></div>

<button id="btn-menu" aria-label="Menu">☰</button>

<div id="menu-panel">
  <div class="menu-section">
    <div class="menu-title">📷 Camera</div>
    <div class="menu-row">
      <button id="btn-cam1">🗼 Tháp Tokyo</button>
      <button id="btn-cam2">🏙️ Toàn cảnh</button>
      <button id="btn-free">🔭 Tự do</button>
    </div>
  </div>
  <div class="menu-section">
    <div class="menu-title">🚗 Xe</div>
    <div class="menu-row">
      <button id="btn-toggle-cars">Bật/tắt xe chạy</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
